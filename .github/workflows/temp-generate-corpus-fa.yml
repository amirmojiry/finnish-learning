name: Temporary generate Persian corpus example translations

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-generate-corpus-fa.yml'

permissions:
  contents: write

concurrency:
  group: temp-corpus-fa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Generate Persian translations for displayed corpus examples
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import json
          import pathlib
          import random
          import time
          import urllib.parse
          import urllib.request

          root = pathlib.Path('.')
          summary = json.loads((root / 'data/ud/word-summary.json').read_text(encoding='utf-8'))
          output = root / 'data/corpus-example-translations-fa.json'

          existing = {}
          if output.exists():
              payload = json.loads(output.read_text(encoding='utf-8'))
              existing = dict(payload.get('translations') or {})

          examples = {}
          for row in summary.get('words', []):
              for example in row.get('examples', []):
                  sentence_id = str(example.get('sentence_id') or '').strip()
                  text = str(example.get('text') or '').strip()
                  if sentence_id and text:
                      examples[sentence_id] = text

          def translate(item):
              sentence_id, text = item
              if str(existing.get(sentence_id, '')).strip():
                  return sentence_id, existing[sentence_id]

              params = urllib.parse.urlencode({
                  'client': 'gtx',
                  'sl': 'fi',
                  'tl': 'fa',
                  'dt': 't',
                  'q': text,
              })
              url = 'https://translate.googleapis.com/translate_a/single?' + params
              last_error = None
              for attempt in range(7):
                  try:
                      request = urllib.request.Request(url, headers={
                          'User-Agent': 'Mozilla/5.0 finnish-learning-corpus-translation/1.0',
                      })
                      with urllib.request.urlopen(request, timeout=25) as response:
                          data = json.loads(response.read().decode('utf-8'))
                      translated = ''.join(
                          segment[0] for segment in (data[0] or [])
                          if isinstance(segment, list) and segment and segment[0]
                      ).strip()
                      if translated:
                          return sentence_id, translated
                      raise RuntimeError('empty translation')
                  except Exception as exc:
                      last_error = exc
                      time.sleep(min(10, (1.6 ** attempt) + random.random()))
              raise RuntimeError(f'{sentence_id}: translation failed after retries: {last_error}')

          missing = [(sid, text) for sid, text in examples.items() if not str(existing.get(sid, '')).strip()]
          print(f'{len(examples)} displayed corpus examples; {len(missing)} translations missing')

          results = dict(existing)
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as executor:
              futures = [executor.submit(translate, item) for item in missing]
              for index, future in enumerate(concurrent.futures.as_completed(futures), start=1):
                  sentence_id, translated = future.result()
                  results[sentence_id] = translated
                  if index % 50 == 0 or index == len(futures):
                      print(f'translated {index}/{len(futures)}')

          translations = {sid: results[sid] for sid in sorted(examples) if str(results.get(sid, '')).strip()}
          if set(translations) != set(examples):
              missing_ids = sorted(set(examples) - set(translations))
              raise RuntimeError(f'missing translations for {len(missing_ids)} displayed corpus examples')

          payload = {
              'schema_version': 1,
              'language': 'fa',
              'description': 'Persian translations for the real UD corpus examples displayed in the dictionary.',
              'translation_method': 'machine-generated once during development and stored locally; no runtime translation API',
              'example_count': len(translations),
              'translations': translations,
          }
          output.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit translation data
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git pull --rebase origin "$HEAD_BRANCH"
          if git diff --quiet -- data/corpus-example-translations-fa.json && git ls-files --error-unmatch data/corpus-example-translations-fa.json >/dev/null 2>&1; then
            echo "No translation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/corpus-example-translations-fa.json
          git commit -m "Add Persian corpus example translations"
          git push origin "HEAD:$HEAD_BRANCH"
