name: Temporary complete Persian corpus example translations

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-complete-corpus-fa.yml'

permissions:
  contents: write

jobs:
  translate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Synchronize branch before generation
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: git pull --rebase origin "$HEAD_BRANCH"

      - name: Add missing morphology-example translations
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import json
          import pathlib
          import time
          import urllib.parse
          import urllib.request

          root = pathlib.Path('.')
          summary = json.loads((root / 'data/ud/word-summary.json').read_text(encoding='utf-8'))
          output = root / 'data/corpus-example-translations-fa.json'
          payload = json.loads(output.read_text(encoding='utf-8'))
          translations = dict(payload.get('translations') or {})

          examples = {}
          for row in summary.get('words', []):
              for example in row.get('examples', []):
                  sid = str(example.get('sentence_id') or '').strip()
                  text = str(example.get('text') or '').strip()
                  if sid and text:
                      examples[sid] = text
              for feature in row.get('features', []):
                  for value in feature.get('values', []):
                      example = value.get('example') or {}
                      sid = str(example.get('sentence_id') or '').strip()
                      text = str(example.get('text') or '').strip()
                      if sid and text:
                          examples[sid] = text

          missing = [(sid, text) for sid, text in examples.items() if not str(translations.get(sid, '')).strip()]
          print(f'{len(examples)} displayed UD sentence IDs; {len(missing)} translations missing')

          def translate(item):
              sid, text = item
              params = urllib.parse.urlencode({
                  'client': 'gtx',
                  'sl': 'fi',
                  'tl': 'fa',
                  'dt': 't',
                  'q': text,
              })
              url = 'https://translate.googleapis.com/translate_a/single?' + params
              last_error = None
              for attempt in range(6):
                  try:
                      request = urllib.request.Request(url, headers={
                          'User-Agent': 'Mozilla/5.0 finnish-learning-corpus-translation/1.0',
                      })
                      with urllib.request.urlopen(request, timeout=25) as response:
                          data = json.loads(response.read().decode('utf-8'))
                      translated = ''.join(
                          segment[0] for segment in (data[0] or [])
                          if isinstance(segment, list) and segment and segment[0]
                      ).strip()
                      if translated:
                          return sid, translated
                      raise RuntimeError('empty translation')
                  except Exception as exc:
                      last_error = exc
                      time.sleep(min(8, 1.6 ** attempt))
              raise RuntimeError(f'{sid}: {last_error}')

          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as executor:
              for sid, translated in executor.map(translate, missing):
                  translations[sid] = translated

          normalized = {sid: translations[sid] for sid in sorted(examples) if str(translations.get(sid, '')).strip()}
          missing_ids = sorted(set(examples) - set(normalized))
          if missing_ids:
              raise RuntimeError(f'missing translations after generation: {missing_ids}')

          payload['example_count'] = len(normalized)
          payload['description'] = 'Persian translations for every real UD sentence rendered in the dictionary, including morphology feature examples.'
          payload['translations'] = normalized
          output.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'wrote {len(normalized)} translations')
          PY

      - name: Commit translation data
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- data/corpus-example-translations-fa.json; then
            echo "No translation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/corpus-example-translations-fa.json
          git commit -m "Translate morphology-only UD examples"
          git push origin "HEAD:$HEAD_BRANCH"
