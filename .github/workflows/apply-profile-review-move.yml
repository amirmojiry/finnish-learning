name: Apply profile review move

on:
  push:
    branches:
      - agent/move-review-to-profile

permissions:
  contents: write

concurrency:
  group: apply-profile-review-move
  cancel-in-progress: true

jobs:
  migrate-and-test:
    if: github.event.head_commit.message != 'Apply profile review release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Move review panel to profile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          replacements = [
              ('<a class="desktop-view-link settings-view-link" href="#settings">تنظیمات</a>', '<a class="desktop-view-link profile-view-link" href="#profile">پروفایل</a>'),
              ('<div id="settings-view" class="app-view settings-view" hidden>', '<div id="profile-view" class="app-view settings-view profile-view" hidden>'),
              ('<h1>تنظیمات</h1>\n          <p>ظاهر و رفتار اپ را شخصی‌سازی کن.</p>', '<h1>پروفایل</h1>\n          <p>مرور هوشمند و تنظیمات شخصی تو.</p>'),
          ]
          for old, new in replacements:
              if old not in index:
                  raise SystemExit(f'Index migration anchor not found: {old}')
              index = index.replace(old, new, 1)

          theme_anchor = '        <section class="settings-section" aria-labelledby="theme-setting-title">'
          profile_slot = '        <div id="spaced-review-slot" class="profile-review-slot" aria-live="polite"></div>\n'
          if 'id="spaced-review-slot"' not in index:
              if theme_anchor not in index:
                  raise SystemExit('Theme settings anchor not found')
              index = index.replace(theme_anchor, profile_slot + theme_anchor, 1)

          bottom_pattern = re.compile(r'    <a class="bottom-nav-item settings-view-link" href="#settings">.*?    </a>', re.S)
          bottom_replacement = '''    <a class="bottom-nav-item profile-view-link" href="#profile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5C21 16.5 17 14 12 14Z"/></svg><span>پروفایل</span>
    </a>'''
          index, count = bottom_pattern.subn(bottom_replacement, index, count=1)
          if count != 1:
              raise SystemExit('Bottom profile navigation anchor not found')
          index_path.write_text(index, encoding='utf-8')

          source_path = Path('spaced-repetition.js')
          source = source_path.read_text(encoding='utf-8')
          old_mount = '''    const hero = document.querySelector('#home-view .hero');
              const quiz = document.getElementById('quiz');
              if (hero && quiz) hero.insertAdjacentElement('afterend', panel);
              return panel;'''
          if old_mount not in source:
              old_mount = '''    const hero = document.querySelector('#home-view .hero');
    const quiz = document.getElementById('quiz');
    if (hero && quiz) hero.insertAdjacentElement('afterend', panel);
    return panel;'''
          new_mount = '''    const slot = document.getElementById('spaced-review-slot');
    if (!slot) return null;
    slot.replaceChildren(panel);
    return panel;'''
          if old_mount not in source:
              raise SystemExit('Review mount anchor not found')
          source_path.write_text(source.replace(old_mount, new_mount, 1), encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              '- daily spaced-repetition review queue with due-word priority and a ten-new-word daily limit',
              '- profile-based spaced-repetition review queue with due-word priority and a ten-new-word daily limit',
              1,
          )
          readme_path.write_text(readme, encoding='utf-8')

          readme_fa_path = Path('README.fa.md')
          readme_fa = readme_fa_path.read_text(encoding='utf-8')
          readme_fa = readme_fa.replace(
              '- صف مرور روزانه بر اساس تکرار فاصله‌دار با تقدم واژه‌های موعددار و سقف روزانه ده واژه جدید',
              '- صف مرور روزانه در بخش پروفایل بر اساس تکرار فاصله‌دار، با تقدم واژه‌های موعددار و سقف روزانه ده واژه جدید',
              1,
          )
          readme_fa_path.write_text(readme_fa, encoding='utf-8')
          PY
      - name: Bump patch version and synchronize files
        run: npm run version:patch
      - name: Document the release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          content = path.read_text(encoding='utf-8')
          placeholder = '- Describe the release changes here.'
          replacement = '### Changed\n\n- The spaced-repetition dashboard now lives in the profile view with appearance settings, while the home view is again dedicated to the full-height exercise card.'
          if placeholder not in content:
              raise SystemExit('Release placeholder was not found')
          path.write_text(content.replace(placeholder, replacement, 1), encoding='utf-8')
          PY
      - name: Run complete regression suite
        run: npm test
      - name: Commit synchronized release files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Apply profile review release
          file_pattern: VERSION package.json CHANGELOG.md index.html README.md README.fa.md deploy-version.txt spaced-repetition.js settings.js css/spaced-repetition.css tests/spaced-repetition.test.cjs docs/SPACED_REPETITION.md
