name: Build vocabulary data

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-vocabulary
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build merged vocabulary
        run: node scripts/build-parole-vocabulary.mjs
      - name: Upload generated vocabulary for the issue branch
        uses: actions/upload-artifact@v4
        with:
          name: generated-vocabulary
          path: data/common-words.json
          if-no-files-found: error
          retention-days: 3
