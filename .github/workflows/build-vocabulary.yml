name: Build vocabulary data

on:
  push:
    paths:
      - data/parole-frequency.json
      - data/parole-new-details.json
      - scripts/build-parole-vocabulary.mjs
      - .github/workflows/build-vocabulary.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build merged vocabulary
        run: node scripts/build-parole-vocabulary.mjs
      - name: Commit generated data
        run: |
          if git diff --quiet -- data/common-words.json; then
            echo "Vocabulary is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/common-words.json
          git commit -m "Build Parole vocabulary data"
          git push
