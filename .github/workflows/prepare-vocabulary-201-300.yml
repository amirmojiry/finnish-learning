name: Prepare vocabulary 201-300

on:
  push:
    branches:
      - agent/add-vocabulary-201-300

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-vocabulary-201-300
      - name: Export source rows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rows = Path('data/parole_frek_3.txt').read_bytes().decode('latin1').splitlines()
          output = '\n'.join(f'{index + 201}\t{row}' for index, row in enumerate(rows[200:300])) + '\n'
          Path('data/vocabulary-details/201-300-source.txt').write_text(output, encoding='utf-8')
          PY
      - name: Commit source rows
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/vocabulary-details/201-300-source.txt
          git commit -m "Export Parole rows 201-300"
          git push
