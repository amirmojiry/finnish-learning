name: Enrich vocabulary data

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enrich-vocabulary.yml'
      - 'scripts/enrich-vocabulary.mjs'
      - 'scripts/vocabulary-enrichment/**'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate enriched vocabulary JSON
        run: node scripts/enrich-vocabulary.mjs

      - name: Commit generated vocabulary data
        run: |
          if git diff --quiet -- data/common-words.json; then
            echo "Vocabulary data is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/common-words.json
          git commit -m "Enrich Finnish vocabulary data"
          git push
