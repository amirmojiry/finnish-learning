name: Extract Parole range

on:
  push:
    paths:
      - .github/workflows/extract-parole-range.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ranks 101-200
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('data/parole_frek_3.txt')
          text = source.read_bytes().decode('latin-1')
          lines = [line for line in text.splitlines() if line.strip()]
          selected = lines[100:200]

          if len(selected) != 100:
              raise SystemExit(f'Expected 100 lines, found {len(selected)}')

          output = Path('data/parole-101-200-source.txt')
          output.write_text('\n'.join(selected) + '\n', encoding='utf-8')
          print(output.read_text(encoding='utf-8'))
          PY

      - name: Commit extracted range
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parole-101-200-source.txt
          git diff --cached --quiet || git commit -m "Extract Parole ranks 101-200"
          git push
