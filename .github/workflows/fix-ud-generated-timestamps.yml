name: Fix deterministic UD timestamps

on:
  push:
    branches:
      - agent/fix-ud-generated-timestamps

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-ud-generated-timestamps
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make UD generation timestamp-stable
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/ud-import/extract_ud.py')
          text = path.read_text(encoding='utf-8')
          marker = '''    for filename, payload in outputs.items():
        destination = output_dir / filename
'''
          replacement = '''    existing_generated_at = None
    substantive_change = False
    for filename, payload in outputs.items():
        destination = output_dir / filename
        candidate = dict(payload)
        candidate.pop("generated_at", None)
        if not destination.exists():
            substantive_change = True
            continue
        existing = json.loads(destination.read_text(encoding="utf-8"))
        existing.pop("generated_at", None)
        if existing != candidate:
            substantive_change = True

    if not substantive_change:
        metadata_path = output_dir / "metadata.json"
        if metadata_path.exists():
            existing_generated_at = json.loads(
                metadata_path.read_text(encoding="utf-8")
            ).get("generated_at")

    if existing_generated_at:
        for payload in outputs.values():
            if "generated_at" in payload:
                payload["generated_at"] = existing_generated_at

    for filename, payload in outputs.items():
        destination = output_dir / filename
'''
          if replacement in text:
              raise SystemExit('Patch already applied')
          if marker not in text:
              raise SystemExit('Expected insertion point not found')
          path.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY
      - name: Verify two consecutive generations are identical
        run: |
          python3 tools/ud-import/extract_ud.py
          python3 tools/ud-import/enrich_multiword_tokens.py
          python3 tools/ud-import/enrich_ui_examples.py
          python3 tools/ud-import/build_ui_summary.py
          python3 tools/ud-import/connect_ui.py
          git add data/ud tools/ud-import/extract_ud.py
          git diff --cached --quiet || true
          first=$(git diff -- data/ud | sha256sum | cut -d' ' -f1)
          python3 tools/ud-import/extract_ud.py
          python3 tools/ud-import/enrich_multiword_tokens.py
          python3 tools/ud-import/enrich_ui_examples.py
          python3 tools/ud-import/build_ui_summary.py
          python3 tools/ud-import/connect_ui.py
          second=$(git diff -- data/ud | sha256sum | cut -d' ' -f1)
          test "$first" = "$second"
          npm test
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-ud-generated-timestamps.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Keep UD generation timestamps deterministic"
          git push origin HEAD:agent/fix-ud-generated-timestamps
