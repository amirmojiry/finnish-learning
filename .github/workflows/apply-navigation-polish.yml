name: Apply navigation polish

on:
  push:
    branches:
      - agent/polish-navigation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-navigation-polish
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/polish-navigation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update navigation, tests, and version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          json_link = '      <a href="data/common-words.json">فایل JSON</a>\n'
          if json_link not in html:
              raise SystemExit('Desktop JSON link anchor not found')
          html = html.replace(json_link, '', 1)
          index.write_text(html, encoding='utf-8')

          styles = Path('css/styles.css')
          source = styles.read_text(encoding='utf-8')
          desktop_marker = '/* Desktop navigation polish */'
          desktop_css = r'''

          /* Desktop navigation polish */
          @media (min-width: 621px) {
            .site-header {
              position: sticky;
              top: 12px;
              z-index: 60;
              min-height: 66px;
              margin-top: 14px;
              padding: 9px 10px 9px 18px;
              border: 1px solid rgba(216, 222, 234, .86);
              border-radius: 20px;
              background: rgba(255, 255, 255, .84);
              box-shadow: 0 12px 34px rgba(31, 42, 68, .09);
              backdrop-filter: blur(18px);
            }

            .site-header .brand {
              display: inline-flex;
              align-items: center;
              gap: 10px;
              padding: 7px 10px;
              border-radius: 14px;
              color: var(--text);
              letter-spacing: -.02em;
            }

            .site-header .brand::before {
              content: "FI";
              width: 34px;
              height: 34px;
              display: grid;
              place-items: center;
              border-radius: 11px;
              background: linear-gradient(135deg, var(--primary), #6d4ee8);
              color: #fff;
              font: 800 .82rem/1 Arial, sans-serif;
              box-shadow: 0 7px 18px rgba(34, 87, 214, .22);
            }

            .site-header nav {
              align-items: center;
              flex-wrap: nowrap;
              gap: 4px;
              padding: 4px;
              border: 1px solid var(--border);
              border-radius: 15px;
              background: var(--surface-soft);
            }

            .site-header nav a {
              min-height: 40px;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              padding: 8px 13px;
              border-radius: 11px;
              font-weight: 700;
              white-space: nowrap;
              transition: color 150ms ease, background 150ms ease, box-shadow 150ms ease, transform 150ms ease;
            }

            .site-header nav a:hover {
              background: rgba(34, 87, 214, .07);
              color: var(--primary);
              transform: translateY(-1px);
            }

            .site-header nav a.active {
              background: var(--surface);
              color: var(--primary);
              box-shadow: 0 4px 14px rgba(31, 42, 68, .11);
            }
          }

          [data-theme="dark"] .site-header {
            background: rgba(17, 26, 42, .88);
            border-color: rgba(111, 126, 153, .34);
          }
          '''
          if desktop_marker not in source:
              source += desktop_css
          styles.write_text(source, encoding='utf-8')

          course_styles = Path('css/course.css')
          source = course_styles.read_text(encoding='utf-8')
          mobile_marker = '/* Five-item mobile navigation fit */'
          mobile_css = r'''

          /* Five-item mobile navigation fit */
          @media (max-width: 620px) {
            .bottom-nav {
              gap: 0;
              flex-wrap: nowrap;
              justify-content: space-around;
              padding-left: max(4px, env(safe-area-inset-left));
              padding-right: max(4px, env(safe-area-inset-right));
              overflow: hidden;
            }

            .bottom-nav-item {
              width: 20%;
              min-width: 0;
              max-width: none;
              flex: 1 1 20%;
              padding: 4px 1px;
              font-size: .64rem;
              line-height: 1.15;
              white-space: nowrap;
              overflow: hidden;
            }

            .bottom-nav-item span {
              display: block;
              max-width: 100%;
              overflow: hidden;
              text-overflow: ellipsis;
            }

            .bottom-nav-item svg {
              width: 22px;
              height: 22px;
              flex: 0 0 auto;
            }
          }

          @media (max-width: 360px) {
            .bottom-nav-item {
              font-size: .59rem;
            }

            .bottom-nav-item svg {
              width: 21px;
              height: 21px;
            }
          }
          '''
          if mobile_marker not in source:
              source += mobile_css
          course_styles.write_text(source, encoding='utf-8')

          tests = Path('tests/course.test.cjs')
          source = tests.read_text(encoding='utf-8')
          test_marker = "test('desktop and mobile navigation stay contained and focused'"
          test_block = r'''

          test('desktop and mobile navigation stay contained and focused', () => {
            const html = fs.readFileSync(path.join(ROOT, 'index.html'), 'utf8');
            const coreStyles = fs.readFileSync(path.join(ROOT, 'css', 'styles.css'), 'utf8');
            const courseStyles = fs.readFileSync(path.join(ROOT, 'css', 'course.css'), 'utf8');
            const desktopHeader = html.match(/<header class="site-header">[\s\S]*?<\/header>/)?.[0] || '';
            assert.doesNotMatch(desktopHeader, /data\/common-words\.json/);
            assert.match(coreStyles, /\/\* Desktop navigation polish \*\/[\s\S]*\.site-header nav/);
            assert.match(courseStyles, /\/\* Five-item mobile navigation fit \*\/[\s\S]*flex-wrap:\s*nowrap/);
            assert.match(courseStyles, /\.bottom-nav-item\s*\{[\s\S]*?max-width:\s*none/);
          });
          '''
          if test_marker not in source:
              source += test_block
          tests.write_text(source, encoding='utf-8')
          PY

          npm run version:patch

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('CHANGELOG.md')
          source = path.read_text(encoding='utf-8')
          pattern = re.compile(r'## \[1\.4\.1\] - \d{4}-\d{2}-\d{2}\n\n- Describe the release changes here\.\n')
          replacement = '''## [1.4.1] - 2026-08-03

          ### Fixed

          - Keep all five mobile navigation items inside the bottom navigation bar, including Settings on narrow screens.

          ### Changed

          - Restyle the desktop header as a compact responsive navigation surface with clearer active and hover states.
          - Remove the raw vocabulary JSON link from the primary desktop navigation.
          '''
          if not pattern.search(source):
              raise SystemExit('Version changelog placeholder not found')
          path.write_text(pattern.sub(replacement, source, count=1), encoding='utf-8')
          PY

          npm test
          rm .github/workflows/apply-navigation-polish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Polish desktop and mobile navigation"
          git push origin HEAD:agent/polish-navigation
