name: Continuous integration

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Require a linked issue
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s\n' "$PR_BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+'; then
            echo "Pull requests must link an issue with a closing keyword, for example: Closes #13"
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize generated files in the test workspace
        run: python3 scripts/sync_project.py
      - name: Refresh coverage snapshots for the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git fetch origin '${{ github.event.pull_request.head.ref }}'
          git checkout -B '${{ github.event.pull_request.head.ref }}' 'origin/${{ github.event.pull_request.head.ref }}'
          npm run curriculum:coverage:write
          npm run lexical:identity:write
          npm run course:review:write
          npm run p2:identity:write
          npm run p2:context:write
          npm run p2:cross-app:write
          npm run r3:structure:write
          npm run section:a21:s1:write
          npm run section:a21:s2:write
          git add data/course/coverage-audit.json docs/COURSE-COVERAGE-AUDIT.md data/course/lexical-identity-sidecar.json data/course/course-review-form-map.json data/course/a2.1-section-1-acceptance.json docs/A21-SECTION1-ACCEPTANCE.md data/course/a2.1-section-2-acceptance.json docs/A21-SECTION2-ACCEPTANCE.md data/course/p2-identity-batch1-audit.json docs/P2-IDENTITY-BATCH1-REPORT.md data/course/contextual-lexical-identity-map.json data/course/p2-cross-app-identity.json docs/P2-CONTEXTUAL-IDENTITY-BATCH2-REPORT.md data/course/section-structure-audit.json docs/SECTION-STRUCTURE-AUDIT.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: regenerate course coverage and acceptance snapshots'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Compile Python sources
        run: python3 -m compileall -q scripts tools tests
      - name: Run complete regression suite
        run: npm test
      - name: Verify generated files were committed
        run: git diff --exit-code
