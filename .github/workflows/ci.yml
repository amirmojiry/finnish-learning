name: Continuous integration

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Require a linked issue
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s\n' "$PR_BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+'; then
            echo "Pull requests must link an issue with a closing keyword, for example: Closes #13"
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize generated files in the test workspace
        run: python3 scripts/sync_project.py
      - name: Refresh coverage snapshots for the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git fetch origin '${{ github.event.pull_request.head.ref }}'
          git checkout -B '${{ github.event.pull_request.head.ref }}' 'origin/${{ github.event.pull_request.head.ref }}'
          npm run curriculum:coverage:write
          if ! git diff --quiet -- data/course/coverage-audit.json docs/COURSE-COVERAGE-AUDIT.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/course/coverage-audit.json docs/COURSE-COVERAGE-AUDIT.md
            git commit -m 'chore: regenerate course coverage snapshots'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: TEMP P4 regenerate and stage source-matched UD artifacts on issue branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/142-parole-vocab-401-425'
        run: |
          python3 tools/ud-import/extract_ud.py
          python3 tools/ud-import/enrich_multiword_tokens.py
          python3 tools/ud-import/enrich_ui_examples.py
          python3 tools/ud-import/build_ui_summary.py
          python3 tools/ud-import/connect_ui.py
          python3 tools/ud-import/stabilize_generated_at.py
          node scripts/build-lexical-identity.cjs --write
          npm run curriculum:coverage:write
          python3 scripts/sync_project.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('data/ud/word-summary.json').read_text())
          existing = json.loads(Path('data/corpus-example-translations-fa.json').read_text())
          rendered = {}
          for word in summary['words']:
              for example in word.get('examples', []):
                  if example.get('sentence_id') and example.get('text'):
                      rendered[example['sentence_id']] = example['text']
              for feature in word.get('features', []):
                  for value in feature.get('values', []):
                      example = value.get('example') or {}
                      if example.get('sentence_id') and example.get('text'):
                          rendered[example['sentence_id']] = example['text']
          missing = [(key, value) for key, value in rendered.items() if key not in existing['translations']]
          print('P4_MISSING_TRANSLATION_COUNT', len(missing))
          for key, value in sorted(missing):
              print('P4_MISSING_TRANSLATION', json.dumps({'id': key, 'fi': value}, ensure_ascii=False))
          print('P4_STALE_TRANSLATION_COUNT', len(set(existing['translations']) - set(rendered)))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ud data/course/lexical-identity-sidecar.json data/course/coverage-audit.json docs/COURSE-COVERAGE-AUDIT.md README.md README.fa.md index.html deploy-version.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore: regenerate UD, lexical identity and coverage for vocabulary 425'
            git push origin HEAD:feat/142-parole-vocab-401-425
          fi
      - name: Compile Python sources
        run: python3 -m compileall -q scripts tools tests
      - name: Run complete regression suite
        run: npm test
      - name: Verify generated files were committed
        run: git diff --exit-code
