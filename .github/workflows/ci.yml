name: Continuous integration

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Require a linked issue
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s\n' "$PR_BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+'; then
            echo "Pull requests must link an issue with a closing keyword, for example: Closes #13"
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize generated files in the test workspace
        run: python3 scripts/sync_project.py
      - name: Refresh coverage snapshots for the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git fetch origin '${{ github.event.pull_request.head.ref }}'
          git checkout -B '${{ github.event.pull_request.head.ref }}' 'origin/${{ github.event.pull_request.head.ref }}'
          npm run curriculum:coverage:write
          if ! git diff --quiet -- data/course/coverage-audit.json docs/COURSE-COVERAGE-AUDIT.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/course/coverage-audit.json docs/COURSE-COVERAGE-AUDIT.md
            git commit -m 'chore: regenerate course coverage snapshots'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Compile Python sources
        run: python3 -m compileall -q scripts tools tests
      - name: Run complete regression suite
        run: npm test
      - name: Verify generated files were committed
        run: git diff --exit-code
