name: Build Parole 200 vocabulary

on:
  push:
    paths:
      - .github/workflows/build-parole-200.yml
      - scripts/build-parole-vocabulary.mjs
      - data/parole-101-150-details.json
      - data/parole-151-200-details.json
      - data/parole_frek_3.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Correct known draft examples
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('data/parole-101-150-details.json')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'Ostin uuden sijaan aivan uusi tietokoneen.',
              'Tämä on aivan uusi tietokone.'
          )
          text = text.replace(
              'Otan yhden nyt ja toisen myöhemmin.',
              'Toinen vaihtoehto valitaan myöhemmin.'
          )
          text = text.replace(
              'یکی را حالا و دیگری را بعداً برمی‌دارم.',
              'گزینه دوم بعداً انتخاب می‌شود.'
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Build and validate 200-word vocabulary JSON
        id: build
        run: |
          set +e
          node scripts/build-parole-vocabulary.mjs > data/parole-build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat data/parole-build.log
          exit 0

      - name: Update app for 200 entries and numeric tokens
        if: steps.build.outputs.status == '0'
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')
          app = app.replace(
              r'sentence.split(/(\p{L}+)/gu)',
              r'sentence.split(/([\p{L}\p{N}]+)/gu)'
          )
          app = app.replace(
              "fetch('./data/common-words.json')",
              "fetch('./data/common-words.json?v=20260731-10')"
          )
          app_path.write_text(app, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('۱۰۰ واژه پرکاربرد فنلاندی', '۲۰۰ واژه پرکاربرد فنلاندی')
          index = index.replace('app.js?v=20260731-7', 'app.js?v=20260731-10')
          index_path.write_text(index, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('100 high-frequency Finnish word forms', '200 high-frequency Finnish word forms')
          readme = readme.replace('The first 100 entries', 'The first 200 entries')
          readme = readme.replace('Each entry includes:', 'Each of the 200 entries includes:')
          readme_path.write_text(readme, encoding='utf-8')

          readme_fa_path = Path('README.fa.md')
          readme_fa = readme_fa_path.read_text(encoding='utf-8')
          readme_fa = readme_fa.replace('۱۰۰ صورت واژگانی پرتکرار فنلاندی', '۲۰۰ صورت واژگانی پرتکرار فنلاندی')
          readme_fa = readme_fa.replace('۱۰۰ مدخل نخست', '۲۰۰ مدخل نخست')
          readme_fa = readme_fa.replace('هر مدخل شامل موارد زیر است:', 'هر یک از ۲۰۰ مدخل شامل موارد زیر است:')
          readme_fa_path.write_text(readme_fa, encoding='utf-8')
          PY

      - name: Commit generated files or diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parole-build.log data/parole-101-150-details.json
          if [ "${{ steps.build.outputs.status }}" = "0" ]; then
            git add data/common-words.json app.js index.html README.md README.fa.md
          fi
          git diff --cached --quiet || git commit -m "Validate Parole vocabulary expansion"
          git push
