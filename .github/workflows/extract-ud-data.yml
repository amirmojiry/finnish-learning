name: Extract Finnish UD data

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'ud-import-2.18/*.conllu'
      - 'tools/ud-import/**'
      - 'data/common-words.json'
      - 'VERSION'
      - '.github/workflows/extract-ud-data.yml'

permissions:
  contents: write

concurrency:
  group: extract-finnish-ud-data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract UD analyses and examples
        run: python3 tools/ud-import/extract_ud.py

      - name: Enrich CoNLL-U multiword tokens
        run: python3 tools/ud-import/enrich_multiword_tokens.py

      - name: Attach feature-specific examples
        run: python3 tools/ud-import/enrich_ui_examples.py

      - name: Build compact browser summary
        run: python3 tools/ud-import/build_ui_summary.py

      - name: Connect UD analysis to the app
        run: python3 tools/ud-import/connect_ui.py

      - name: Synchronize project metadata
        run: python3 scripts/sync_project.py

      - name: Stabilize unchanged generation timestamps
        run: python3 tools/ud-import/stabilize_generated_at.py

      - name: Commit regenerated UD data for abbreviation disambiguation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'issue-63-vocabulary-301-400'
        run: |
          if git diff --quiet -- data/ud; then
            echo "No UD data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ud
          git commit -m "Regenerate UD data after abbreviation disambiguation"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Validate generated JSON files and UI references
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          data_dir = pathlib.Path('data/ud')
          names = [
              'word-analyses.json',
              'word-summary.json',
              'examples.json',
              'labels-fa.json',
              'metadata.json',
              'coverage-report.json',
          ]
          data = {
              name: json.loads((data_dir / name).read_text(encoding='utf-8'))
              for name in names
          }
          vocabulary = json.loads(
              pathlib.Path('data/common-words.json').read_text(encoding='utf-8')
          )
          vocabulary_count = len(vocabulary['words'])
          vocabulary_forms = {row['word'].casefold() for row in vocabulary['words']}

          summary = data['word-summary.json']
          summary_forms = {row['word'].casefold() for row in summary['words']}
          assert summary['schema_version'] == 2
          assert summary['word_count'] == vocabulary_count
          assert summary_forms == vocabulary_forms

          if 'ovat' in vocabulary_forms:
              ovat = next(row for row in summary['words'] if row['word'].casefold() == 'ovat')
              assert ovat['upos'][0]['tag'] == 'AUX'
              assert ovat['examples']
              mood = next(feature for feature in ovat['features'] if feature['name'] == 'Mood')
              indicative = next(value for value in mood['values'] if value['value'] == 'Ind')
              assert indicative.get('example', {}).get('text')

          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          assert html.count('css/ud-analysis.css') == 1
          assert html.count('css/ud-analysis-examples.css') == 1
          assert html.count('dictionary-pos.js') == 1
          assert html.count('ud-analysis.js') == 1
          print((data_dir / 'coverage-report.json').read_text(encoding='utf-8'))
          PY

      - name: Verify generated UD data is committed
        run: git diff --exit-code

      - name: Upload generated data
        uses: actions/upload-artifact@v4
        with:
          name: finnish-ud-data-2.18
          path: data/ud/*.json
          if-no-files-found: error
          retention-days: 7
