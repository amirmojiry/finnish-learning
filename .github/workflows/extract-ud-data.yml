name: Extract Finnish UD data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ud-import-2.18/*.conllu'
      - 'tools/ud-import/**'
      - 'data/common-words.json'
      - '.github/workflows/extract-ud-data.yml'

permissions:
  contents: write

concurrency:
  group: extract-finnish-ud-data
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract UD analyses and examples
        run: python3 tools/ud-import/extract_ud.py

      - name: Validate generated JSON files
        run: python3 -c "import json,pathlib; p=pathlib.Path('data/ud'); names=['word-analyses.json','examples.json','labels-fa.json','metadata.json','coverage-report.json']; [json.loads((p/n).read_text(encoding='utf-8')) for n in names]; print((p/'coverage-report.json').read_text(encoding='utf-8'))"

      - name: Upload generated data
        uses: actions/upload-artifact@v4
        with:
          name: finnish-ud-data-2.18
          path: data/ud/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Generate Finnish UD enrichment data
          file_pattern: data/ud/*.json
