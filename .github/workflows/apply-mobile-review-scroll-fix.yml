name: Apply mobile review scroll fix

on:
  push:
    branches:
      - agent/fix-mobile-review-scroll

permissions:
  contents: write

concurrency:
  group: apply-mobile-review-scroll-fix
  cancel-in-progress: true

jobs:
  release-and-test:
    if: github.event.head_commit.message != 'Apply mobile review scroll release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bump patch version and synchronize files
        run: npm run version:patch
      - name: Document the bug fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          content = path.read_text(encoding='utf-8')
          placeholder = '- Describe the release changes here.'
          replacement = '### Fixed\n\n- The mobile home view now scrolls when the spaced-review panel is present, keeping the exercise card and all answer controls reachable.'
          if placeholder not in content:
              raise SystemExit('Release placeholder was not found in CHANGELOG.md')
          path.write_text(content.replace(placeholder, replacement, 1), encoding='utf-8')
          PY
      - name: Run complete regression suite
        run: npm test
      - name: Commit synchronized release files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Apply mobile review scroll release
          file_pattern: VERSION package.json CHANGELOG.md index.html README.md README.fa.md deploy-version.txt css/spaced-repetition.css tests/spaced-repetition.test.cjs
